name: Check Apple US Stock

on:
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Check Apple stock
        run: python check_stock.py

      - name: Test iPhone notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: Apple Stock Checker" \
            -H "Priority: high" \
            -H "Tags: apple" \
            -d "Notification test successful! MJW64LL/A monitoring is ready." \
            "https://ntfy.sh/$NTFY_TOPIC"
          
