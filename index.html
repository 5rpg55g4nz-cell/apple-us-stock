<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apple US Stock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 60px;
  background: #f5f5f7;
  color: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont,
               "SF Pro Text", "Helvetica Neue",
               Arial, sans-serif;
}

.container {
  max-width: 720px;
  margin: auto;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  color: #6e6e73;
  margin: 6px 0 25px;
}

/* FILTER */

.filters {
  background: white;
  padding: 18px;
  border-radius: 22px;
  margin-bottom: 22px;
}

.filter-title {
  font-size: 12px;
  color: #86868b;
  font-weight: 600;
  margin: 4px 0 8px;
}

select {
  width: 100%;
  font-size: 16px;
  padding: 12px;
  margin-bottom: 14px;
  border: 1px solid #d2d2d7;
  border-radius: 12px;
  background: white;
}

.stock-only {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  margin-top: 3px;
}

.stock-only input {
  width: 20px;
  height: 20px;
}

/* PRODUCT */

.product {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 18px;
}

.product-name {
  font-size: 20px;
  font-weight: 700;
}

.part-number {
  color: #86868b;
  font-size: 13px;
  margin-top: 4px;
}

.region {
  margin-top: 20px;
}

.region-name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 5px;
}

.store {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

  padding: 13px 0;
  border-top: 1px solid #e5e5e7;
}

.store-name {
  font-size: 15px;
  font-weight: 500;
}

.available {
  color: #248a3d;
  font-weight: 600;
  white-space: nowrap;
}

.unavailable {
  color: #d70015;
  font-weight: 600;
  white-space: nowrap;
}

.empty {
  background: white;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  color: #6e6e73;
}

#updated {
  text-align: center;
  color: #86868b;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>🇺🇸 Apple US Stock</h1>

<div class="subtitle">
iPhone pickup availability
</div>


<div class="filters">

<div class="filter-title">
MODEL
</div>

<select id="modelFilter">
  <option value="all">All Models</option>
  <option value="iPhone 18 Pro ">iPhone 18 Pro</option>
  <option value="iPhone 18 Pro Max">iPhone 18 Pro Max</option>
</select>


<div class="filter-title">
STORAGE
</div>

<select id="storageFilter">
  <option value="all">All Storage</option>
  <option value="256GB">256GB</option>
  <option value="512GB">512GB</option>
  <option value="1TB">1TB</option>
  <option value="2TB">2TB</option>
</select>


<div class="filter-title">
COLOR
</div>

<select id="colorFilter">
  <option value="all">All Colors</option>
  <option value="Black">Black</option>
  <option value="Silver">Silver</option>
  <option value="Burgundy">Burgundy</option>
  <option value="Glacier">Glacier</option>
</select>


<div class="filter-title">
REGION
</div>

<select id="regionFilter">
  <option value="all">All Regions</option>
  <option value="Oregon">Oregon</option>
  <option value="Hawaii">Hawaii</option>
</select>


<label class="stock-only">
  <input
    type="checkbox"
    id="stockOnly"
  >
  🟢 Show available products only
</label>

</div>


<div id="products">
Loading availability...
</div>

<div id="updated"></div>

</div>


<script>

let stockData = null;


async function loadStock() {

  try {

    const response = await fetch(
      "stock.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Unable to load stock.json");
    }

    stockData = await response.json();

    renderProducts();

    document.getElementById(
      "updated"
    ).innerText =
      "Last checked: " + stockData.updated;

  }

  catch(error) {

    document.getElementById(
      "products"
    ).innerHTML =
      '<div class="empty">' +
      'Stock data is currently unavailable.' +
      '</div>';

    console.error(error);
  }
}


function renderProducts() {

  if (!stockData) return;

  const model =
    document.getElementById(
      "modelFilter"
    ).value;

  const storage =
    document.getElementById(
      "storageFilter"
    ).value;

  const color =
    document.getElementById(
      "colorFilter"
    ).value;

  const selectedRegion =
    document.getElementById(
      "regionFilter"
    ).value;

  const stockOnly =
    document.getElementById(
      "stockOnly"
    ).checked;


  const container =
    document.getElementById(
      "products"
    );

  container.innerHTML = "";

  let displayed = 0;


  stockData.products.forEach(product => {

    const name = product.name;


    /* MODEL FILTER */

    if (
      model !== "all" &&
      !name.startsWith(model)
    ) {
      return;
    }


    /* STORAGE FILTER */

    if (
      storage !== "all" &&
      !name.includes(storage)
    ) {
      return;
    }


    /* COLOR FILTER */

    if (
      color !== "all" &&
      !name.endsWith(color)
    ) {
      return;
    }


    let regionsHTML = "";

    let productHasStock = false;


    product.regions.forEach(region => {

      if (
        selectedRegion !== "all" &&
        region.name !== selectedRegion
      ) {
        return;
      }


      let storesHTML = "";

      region.stores.forEach(store => {

        if (store.available) {
          productHasStock = true;
        }

        const statusClass =
          store.available
          ? "available"
          : "unavailable";

        const status =
          store.available
          ? "● Available"
          : "● Unavailable";


        storesHTML += `
          <div class="store">

            <div class="store-name">
              ${store.name}
            </div>

            <div class="${statusClass}">
              ${status}
            </div>

          </div>
        `;

      });


      if (storesHTML) {

        regionsHTML += `
          <div class="region">

            <div class="region-name">
              ${region.name}
            </div>

            ${storesHTML}

          </div>
        `;
      }

    });


    if (
      stockOnly &&
      !productHasStock
    ) {
      return;
    }


    if (!regionsHTML) {
      return;
    }


    const card =
      document.createElement("div");

    card.className = "product";

    card.innerHTML = `

      <div class="product-name">
        ${product.name}
      </div>

      <div class="part-number">
        ${product.partNumber}
      </div>

      ${regionsHTML}
    `;

    container.appendChild(card);

    displayed++;

  });


  if (displayed === 0) {

    container.innerHTML = `
      <div class="empty">
        No matching products found.
      </div>
    `;

  }

}


/* FILTER EVENTS */

document
.getElementById("modelFilter")
.addEventListener(
  "change",
  renderProducts
);

document
.getElementById("storageFilter")
.addEventListener(
  "change",
  renderProducts
);

document
.getElementById("colorFilter")
.addEventListener(
  "change",
  renderProducts
);

document
.getElementById("regionFilter")
.addEventListener(
  "change",
  renderProducts
);

document
.getElementById("stockOnly")
.addEventListener(
  "change",
  renderProducts
);


/* START */

loadStock();

/* 1分ごとに在庫データを再読込 */

setInterval(
  loadStock,
  60000
);

</script>

</body>
</html>
