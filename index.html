<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Buddy</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 60px;
  background: #f5f5f7;
  color: #1d1d1f;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  max-width: 720px;
  margin: auto;
}


/* ================================
   HEADER
================================ */

h1 {
  margin: 0;
  font-size: 34px;
  letter-spacing: -0.7px;
}

.subtitle {
  color: #6e6e73;
  margin: 6px 0 22px;
  font-size: 16px;
}


/* ================================
   SUMMARY
================================ */

.summary {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 18px;
}

.summary-number {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.green-dot {
  width: 13px;
  height: 13px;

  background: #30d158;

  border-radius: 50%;
  flex-shrink: 0;
}

.summary-text {
  color: #6e6e73;
  font-size: 14px;
  margin-top: 6px;
}


/* ================================
   FILTERS
================================ */

.filters {
  background: white;

  padding: 18px;

  border-radius: 22px;

  margin-bottom: 22px;
}

.filters-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 4px;
}

.filters-heading {
  font-size: 17px;
  font-weight: 700;
}

.reset-button {
  border: none;
  background: none;

  color: #0071e3;

  font-size: 14px;

  padding: 6px 0 6px 12px;

  cursor: pointer;
}

.filter-title {
  font-size: 12px;
  color: #86868b;

  font-weight: 600;

  margin: 14px 0 8px;
}

select {
  width: 100%;

  font-size: 16px;

  padding: 12px;

  margin-bottom: 2px;

  border: 1px solid #d2d2d7;
  border-radius: 12px;

  background: white;
}

.stock-only {
  display: flex;
  align-items: center;

  gap: 10px;

  font-size: 15px;

  margin-top: 18px;
}

.stock-only input {
  width: 20px;
  height: 20px;
}


/* ================================
   PRODUCTS
================================ */

.product {
  background: white;

  border-radius: 22px;

  padding: 20px;

  margin-bottom: 18px;
}

.product-name {
  font-size: 20px;
  font-weight: 700;

  line-height: 1.25;
}

.part-number {
  color: #86868b;

  font-size: 13px;

  margin-top: 4px;
}


/* ================================
   PRICE
================================ */

.price {
  margin-top: 10px;

  font-size: 17px;

  font-weight: 600;

  color: #1d1d1f;
}

.yen-price {
  color: #6e6e73;

  font-weight: 500;
}

.exchange-note {
  color: #86868b;

  font-size: 12px;

  margin-top: 4px;
}


/* ================================
   REGIONS / STORES
================================ */

.region {
  margin-top: 20px;
}

.region-name {
  font-size: 14px;

  font-weight: 700;

  margin-bottom: 5px;
}

.store {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  padding: 13px 0;

  border-top: 1px solid #e5e5e7;
}

.store-name {
  font-size: 15px;

  font-weight: 500;
}


/* ================================
   STATUS
================================ */

.status {
  display: flex;

  align-items: center;

  gap: 7px;

  font-weight: 600;

  white-space: nowrap;
}

.status-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  flex-shrink: 0;
}

.available {
  color: #248a3d;
}

.available .status-dot {
  background: #30d158;
}

.unavailable {
  color: #d70015;
}

.unavailable .status-dot {
  background: #ff3b30;
}


/* ================================
   EMPTY
================================ */

.empty {
  background: white;

  border-radius: 20px;

  padding: 30px 20px;

  text-align: center;

  color: #6e6e73;
}


/* ================================
   FOOTER
================================ */

#exchangeInfo {
  text-align: center;

  color: #86868b;

  font-size: 12px;

  margin-top: 26px;
}

#updated {
  text-align: center;

  color: #86868b;

  font-size: 13px;

  margin-top: 7px;
}

</style>
</head>


<body>

<div class="container">


  <!-- ============================
       HEADER
  ============================= -->

  <h1>
    Stock Buddy
  </h1>

  <div class="subtitle">
    I’ll keep an eye on it for you.
  </div>


  <!-- ============================
       SUMMARY
  ============================= -->

  <div class="summary">

    <div class="summary-number">

      <span class="green-dot"></span>

      <span id="availableCount">
        — Available
      </span>

    </div>

    <div
      class="summary-text"
      id="summaryText"
    >
      Loading current availability...
    </div>

  </div>


  <!-- ============================
       FILTERS
  ============================= -->

  <div class="filters">

    <div class="filters-header">

      <div class="filters-heading">
        Filters
      </div>

      <button
        class="reset-button"
        id="resetFilters"
        type="button"
      >
        Reset Filters
      </button>

    </div>


    <!-- MODEL -->

    <div class="filter-title">
      MODEL
    </div>

    <select id="modelFilter">

      <option value="all">
        All Models
      </option>

      <option value="pro">
        iPhone 18 Pro
      </option>

      <option value="promax">
        iPhone 18 Pro Max
      </option>

    </select>


    <!-- STORAGE -->

    <div class="filter-title">
      STORAGE
    </div>

    <select id="storageFilter">

      <option value="all">
        All Storage
      </option>

      <option value="256GB">
        256GB
      </option>

      <option value="512GB">
        512GB
      </option>

      <option value="1TB">
        1TB
      </option>

      <option value="2TB">
        2TB
      </option>

    </select>


    <!-- COLOR -->

    <div class="filter-title">
      COLOR
    </div>

    <select id="colorFilter">

      <option value="all">
        All Colors
      </option>

      <option value="Black">
        Black
      </option>

      <option value="Silver">
        Silver
      </option>

      <option value="Burgundy">
        Burgundy
      </option>

      <option value="Glacier">
        Glacier
      </option>

    </select>


    <!-- REGION -->

    <div class="filter-title">
      REGION
    </div>

    <select id="regionFilter">

      <option value="all">
        All Regions
      </option>

      <option value="Oregon">
        Oregon
      </option>

      <option value="Hawaii">
        Hawaii
      </option>

    </select>


    <!-- STORE -->

    <div class="filter-title">
      STORE
    </div>

    <select id="storeFilter">

      <option value="all">
        All Stores
      </option>

    </select>


    <!-- AVAILABLE ONLY -->

    <label class="stock-only">

      <input
        type="checkbox"
        id="stockOnly"
      >

      <span class="status available">

        <span class="status-dot"></span>

        Show available products only

      </span>

    </label>

  </div>


  <!-- ============================
       PRODUCTS
  ============================= -->

  <div id="products">
    Loading availability...
  </div>


  <!-- ============================
       FOOTER
  ============================= -->

  <div id="exchangeInfo">
    Loading exchange rate...
  </div>

  <div id="updated"></div>

</div>


<script>

/* ================================
   BASIC DATA
================================ */

let stockData = null;

let usdJpyRate = null;

let exchangeRateDate = null;


const STORAGE_KEY =
  "stockBuddyFilters";


/* ================================
   US PRICES
================================ */

const US_PRICES = {

  pro: {

    "256GB": 1199,

    "512GB": 1399,

    "1TB": 1799,

    "2TB": 2399

  },


  promax: {

    "256GB": 1299,

    "512GB": 1499,

    "1TB": 1899,

    "2TB": 2499

  }

};


/* ================================
   STORES
================================ */

const storesByRegion = {

  Oregon: [

    "Pioneer Place",

    "Washington Square",

    "Bridgeport Village"

  ],


  Hawaii: [

    "Ala Moana",

    "Kahala"

  ]

};


/* ================================
   STORE FILTER
================================ */

function updateStoreFilter(
  selectedStore = "all"
) {

  const region =
    document.getElementById(
      "regionFilter"
    ).value;


  const storeFilter =
    document.getElementById(
      "storeFilter"
    );


  storeFilter.innerHTML =
    '<option value="all">All Stores</option>';


  if (region === "all") {

    Object.entries(
      storesByRegion
    ).forEach(
      ([regionName, stores]) => {


        const group =
          document.createElement(
            "optgroup"
          );


        group.label =
          regionName;


        stores.forEach(
          store => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              store;


            option.textContent =
              store;


            group.appendChild(
              option
            );

          }
        );


        storeFilter.appendChild(
          group
        );

      }
    );

  }

  else {

    const stores =
      storesByRegion[region] || [];


    stores.forEach(
      store => {


        const option =
          document.createElement(
            "option"
          );


        option.value =
          store;


        option.textContent =
          store;


        storeFilter.appendChild(
          option
        );

      }
    );

  }


  /*
  前回の店舗が
  現在のRegion内に存在する場合だけ復元
  */

  const validOption =
    Array.from(
      storeFilter.options
    ).some(
      option =>
        option.value === selectedStore
    );


  storeFilter.value =
    validOption
      ? selectedStore
      : "all";

}


/* ================================
   SAVE FILTERS
================================ */

function saveFilters() {

  const settings = {

    model:
      document.getElementById(
        "modelFilter"
      ).value,

    storage:
      document.getElementById(
        "storageFilter"
      ).value,

    color:
      document.getElementById(
        "colorFilter"
      ).value,

    region:
      document.getElementById(
        "regionFilter"
      ).value,

    store:
      document.getElementById(
        "storeFilter"
      ).value,

    stockOnly:
      document.getElementById(
        "stockOnly"
      ).checked

  };


  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(settings)
    );

  }

  catch(error) {

    console.error(
      "Unable to save filters:",
      error
    );

  }

}


/* ================================
   LOAD SAVED FILTERS
================================ */

function loadSavedFilters() {

  let settings = null;


  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (saved) {

      settings =
        JSON.parse(saved);

    }

  }

  catch(error) {

    console.error(
      "Unable to load filters:",
      error
    );

  }


  if (!settings) {

    updateStoreFilter();

    return;

  }


  document.getElementById(
    "modelFilter"
  ).value =
    settings.model || "all";


  document.getElementById(
    "storageFilter"
  ).value =
    settings.storage || "all";


  document.getElementById(
    "colorFilter"
  ).value =
    settings.color || "all";


  document.getElementById(
    "regionFilter"
  ).value =
    settings.region || "all";


  document.getElementById(
    "stockOnly"
  ).checked =
    settings.stockOnly === true;


  updateStoreFilter(
    settings.store || "all"
  );

}


/* ================================
   RESET FILTERS
================================ */

function resetFilters() {

  document.getElementById(
    "modelFilter"
  ).value =
    "all";


  document.getElementById(
    "storageFilter"
  ).value =
    "all";


  document.getElementById(
    "colorFilter"
  ).value =
    "all";


  document.getElementById(
    "regionFilter"
  ).value =
    "all";


  document.getElementById(
    "stockOnly"
  ).checked =
    false;


  updateStoreFilter();


  document.getElementById(
    "storeFilter"
  ).value =
    "all";


  try {

    localStorage.removeItem(
      STORAGE_KEY
    );

  }

  catch(error) {

    console.error(
      "Unable to reset filters:",
      error
    );

  }


  renderProducts();

}


/* ================================
   EXCHANGE RATE
================================ */

async function loadExchangeRate() {

  const exchangeInfo =
    document.getElementById(
      "exchangeInfo"
    );


  try {

    const response =
      await fetch(
        "https://api.frankfurter.dev/v2/rate/usd/jpy"
      );


    if (!response.ok) {

      throw new Error(
        "Unable to load exchange rate"
      );

    }


    const data =
      await response.json();


    usdJpyRate =
      Number(data.rate);


    exchangeRateDate =
      data.date;


    exchangeInfo.textContent =
      `USD/JPY: ¥${usdJpyRate.toFixed(2)} · Rate date: ${exchangeRateDate}`;

  }

  catch(error) {

    usdJpyRate =
      null;


    exchangeInfo.textContent =
      "Live USD/JPY rate unavailable";


    console.error(
      "Exchange rate error:",
      error
    );

  }

}


/* ================================
   PRODUCT PRICE
================================ */

function getPriceInfo(
  productName
) {

  const isProMax =
    productName.startsWith(
      "iPhone 18 Pro Max "
    );


  const model =
    isProMax
      ? "promax"
      : "pro";


  let storage = null;


  if (
    productName.includes(
      "256GB"
    )
  ) {

    storage =
      "256GB";

  }

  else if (
    productName.includes(
      "512GB"
    )
  ) {

    storage =
      "512GB";

  }

  else if (
    productName.includes(
      "1TB"
    )
  ) {

    storage =
      "1TB";

  }

  else if (
    productName.includes(
      "2TB"
    )
  ) {

    storage =
      "2TB";

  }


  if (!storage) {

    return "";

  }


  const usd =
    US_PRICES[model][storage];


  if (!usd) {

    return "";

  }


  const usdText =
    new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0
      }
    ).format(
      usd
    );


  /*
  為替取得に失敗した場合は
  US価格だけ表示
  */

  if (!usdJpyRate) {

    return `
      <div class="price">
        ${usdText}
      </div>
    `;

  }


  /*
  日本円は
  1,000円単位に丸める
  */

  const rawYen =
    usd * usdJpyRate;


  const roundedYen =
    Math.round(
      rawYen / 1000
    ) * 1000;


  const yenText =
    new Intl.NumberFormat(
      "ja-JP",
      {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }
    ).format(
      roundedYen
    );


  return `

    <div class="price">

      ${usdText}

      <span class="yen-price">

        · 約 ${yenText}

      </span>

    </div>

  `;

}


/* ================================
   LOAD STOCK
================================ */

async function loadStock() {

  try {

    const response =
      await fetch(
        "stock.json?t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "Unable to load stock.json"
      );

    }


    stockData =
      await response.json();


    renderProducts();


    document.getElementById(
      "updated"
    ).innerText =
      "Last checked: " +
      stockData.updated;

  }

  catch(error) {

    document.getElementById(
      "products"
    ).innerHTML = `

      <div class="empty">

        Stock data is currently unavailable.

      </div>

    `;


    console.error(
      error
    );

  }

}


/* ================================
   RENDER PRODUCTS
================================ */

function renderProducts() {

  if (!stockData) {

    return;

  }


  const model =
    document.getElementById(
      "modelFilter"
    ).value;


  const storage =
    document.getElementById(
      "storageFilter"
    ).value;


  const color =
    document.getElementById(
      "colorFilter"
    ).value;


  const selectedRegion =
    document.getElementById(
      "regionFilter"
    ).value;


  const selectedStore =
    document.getElementById(
      "storeFilter"
    ).value;


  const stockOnly =
    document.getElementById(
      "stockOnly"
    ).checked;


  const container =
    document.getElementById(
      "products"
    );


  container.innerHTML =
    "";


  let displayed =
    0;


  let availableCount =
    0;


  stockData.products.forEach(
    product => {


      const name =
        product.name;


      /* ============================
         MODEL
      ============================ */

      const isProMax =
        name.startsWith(
          "iPhone 18 Pro Max "
        );


      const isPro =
        name.startsWith(
          "iPhone 18 Pro "
        ) &&
        !isProMax;


      if (
        model === "pro" &&
        !isPro
      ) {

        return;

      }


      if (
        model === "promax" &&
        !isProMax
      ) {

        return;

      }


      /* ============================
         STORAGE
      ============================ */

      if (
        storage !== "all" &&
        !name.includes(
          storage
        )
      ) {

        return;

      }


      /* ============================
         COLOR
      ============================ */

      if (
        color !== "all" &&
        !name.endsWith(
          color
        )
      ) {

        return;

      }


      let regionsHTML =
        "";


      let productHasStock =
        false;


      product.regions.forEach(
        region => {


          /* ========================
             REGION
          ======================== */

          if (
            selectedRegion !== "all" &&
            region.name !==
              selectedRegion
          ) {

            return;

          }


          let storesHTML =
            "";


          region.stores.forEach(
            store => {


              /* ====================
                 STORE
              ==================== */

              if (
                selectedStore !== "all" &&
                store.name !==
                  selectedStore
              ) {

                return;

              }


              if (
                store.available
              ) {

                productHasStock =
                  true;


                availableCount++;

              }


              const statusClass =
                store.available
                  ? "available"
                  : "unavailable";


              const statusText =
                store.available
                  ? "Available"
                  : "Unavailable";


              storesHTML += `

                <div class="store">

                  <div class="store-name">

                    ${store.name}

                  </div>


                  <div
                    class="status ${statusClass}"
                  >

                    <span
                      class="status-dot"
                    ></span>

                    ${statusText}

                  </div>

                </div>

              `;

            }
          );


          if (storesHTML) {

            regionsHTML += `

              <div class="region">

                <div class="region-name">

                  ${region.name}

                </div>

                ${storesHTML}

              </div>

            `;

          }

        }
      );


      /* ============================
         AVAILABLE ONLY
      ============================ */

      if (
        stockOnly &&
        !productHasStock
      ) {

        return;

      }


      if (!regionsHTML) {

        return;

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product";


      card.innerHTML = `

        <div class="product-name">

          ${product.name}

        </div>


        <div class="part-number">

          ${product.partNumber}

        </div>


        ${getPriceInfo(
          product.name
        )}


        ${regionsHTML}

      `;


      container.appendChild(
        card
      );


      displayed++;

    }
  );


  /* ================================
     SUMMARY
  ================================ */

  document.getElementById(
    "availableCount"
  ).textContent =
    `${availableCount} Available`;


  if (
    availableCount === 0
  ) {

    document.getElementById(
      "summaryText"
    ).textContent =
      "No pickup availability for the current filters.";

  }

  else if (
    availableCount === 1
  ) {

    document.getElementById(
      "summaryText"
    ).textContent =
      "1 available store / product combination.";

  }

  else {

    document.getElementById(
      "summaryText"
    ).textContent =
      `${availableCount} available store / product combinations.`;

  }


  /* ================================
     NO PRODUCTS
  ================================ */

  if (
    displayed === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        No matching products found.

      </div>

    `;

  }

}


/* ================================
   FILTER CHANGE
================================ */

function filterChanged() {

  saveFilters();

  renderProducts();

}


/* MODEL */

document
.getElementById(
  "modelFilter"
)
.addEventListener(
  "change",
  filterChanged
);


/* STORAGE */

document
.getElementById(
  "storageFilter"
)
.addEventListener(
  "change",
  filterChanged
);


/* COLOR */

document
.getElementById(
  "colorFilter"
)
.addEventListener(
  "change",
  filterChanged
);


/* REGION */

document
.getElementById(
  "regionFilter"
)
.addEventListener(
  "change",
  function() {

    updateStoreFilter();

    saveFilters();

    renderProducts();

  }
);


/* STORE */

document
.getElementById(
  "storeFilter"
)
.addEventListener(
  "change",
  filterChanged
);


/* AVAILABLE ONLY */

document
.getElementById(
  "stockOnly"
)
.addEventListener(
  "change",
  filterChanged
);


/* RESET */

document
.getElementById(
  "resetFilters"
)
.addEventListener(
  "click",
  resetFilters
);


/* ================================
   START
================================ */

/*
前回選択したフィルターを復元
*/

loadSavedFilters();


/*
為替を取得してから
在庫情報を表示
*/

async function startApp() {

  await loadExchangeRate();

  await loadStock();

}


startApp();


/*
ページを開いている間は
60秒ごとに在庫情報を更新
*/

setInterval(
  loadStock,
  60000
);

</script>

</body>
</html>
