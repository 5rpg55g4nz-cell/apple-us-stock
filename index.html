<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apple US Stock Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 50px;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Text", "Helvetica Neue",
                   Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 5px;
    }

    .subtitle {
      color: #6e6e73;
      margin-bottom: 28px;
    }

    .product {
      background: white;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 24px;
    }

    .label {
      font-size: 12px;
      color: #86868b;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .part-number {
      font-size: 22px;
      font-weight: 700;
    }

    .region {
      color: #6e6e73;
      font-size: 14px;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .store {
      padding: 16px 0;
      border-top: 1px solid #e5e5e7;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .store-name {
      font-size: 16px;
      font-weight: 600;
    }

    .available {
      color: #248a3d;
      font-weight: 600;
      white-space: nowrap;
    }

    .unavailable {
      color: #d70015;
      font-weight: 600;
      white-space: nowrap;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 18px;
    }

    #updated {
      text-align: center;
      color: #86868b;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🇺🇸 Apple US Stock</h1>

  <div class="subtitle">
    Apple Store pickup availability
  </div>

  <div id="products">
    Loading availability...
  </div>

  <div id="updated"></div>

</div>

<script>

async function loadStock() {

  try {

    const response = await fetch(
      "stock.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Unable to load stock.json");
    }

    const data = await response.json();

    const container =
      document.getElementById("products");

    container.innerHTML = "";

    data.products.forEach(product => {

      const productCard =
        document.createElement("div");

      productCard.className = "product";

      let storesHTML = "";

      product.stores.forEach(store => {

        const statusClass =
          store.available
            ? "available"
            : "unavailable";

        const statusText =
          store.available
            ? "● Available"
            : "● Unavailable";

        storesHTML += `
          <div class="store">

            <div class="store-name">
              ${store.name}
            </div>

            <div class="${statusClass}">
              ${statusText}
            </div>

          </div>
        `;
      });

      productCard.innerHTML = `

        <div class="label">
          PART NUMBER
        </div>

        <div class="part-number">
          ${product.partNumber}
        </div>

        <div class="region">
          ${product.region}
        </div>

        ${storesHTML}
      `;

      container.appendChild(productCard);

    });

    document.getElementById("updated").innerText =
      "Last checked: " + data.updated;

  }

  catch(error) {

    document.getElementById("products").innerHTML =
      `<div class="error">
        Stock data is currently unavailable.
      </div>`;

    console.error(error);
  }

}

loadStock();

/* ページを開いている間は1分ごとに再読込 */
setInterval(loadStock, 60000);

</script>

</body>
</html>
